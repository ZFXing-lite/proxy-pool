[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxy-pool"
version = "1.0.0"
description = "Multi-source public proxy IP pool with validation, caching, and API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.8.0",
    "requests>=2.25.0",
    "fastapi>=0.70.0",
    "uvicorn>=0.15.0",
    "pydantic>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx"]

[project.scripts]
proxy-pool = "proxy_pool.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["proxy_pool*"]
